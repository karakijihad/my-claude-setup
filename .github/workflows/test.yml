name: test

# The suite is the whole gate for this plugin, and it used to run only when
# somebody remembered to type it. Running it here means a pull request from
# anyone gets the same check the maintainer gets.
#
# Both platforms on purpose. The plugin exists largely because Windows breaks
# assumptions Unix tooling makes — a `python3` that is a 0-byte Store stub, CRLF
# checkouts that kill a shebang, a BOM that makes a healthy config look absent —
# and every one of those is invisible on ubuntu alone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The suite prefers jq and falls back to Python; ubuntu images ship it,
      # windows images do not. Installing it on both means the jq path is the
      # one actually exercised here, and the Python fallback keeps its own
      # dedicated assertion rather than being tested only by accident.
      - name: Install jq (Windows)
        if: runner.os == 'Windows'
        run: choco install jq --no-progress -y

      - name: Line endings must be LF
        shell: bash
        run: |
          # .gitattributes pins *.sh, and hooks/core.md, to LF. With
          # core.autocrlf=true a CRLF checkout makes bash die on `bad
          # interpreter` for a script, and it fails in a way that looks like a
          # missing file rather than a line-ending problem. core.md is pinned
          # for a different reason: the no-Python fallback in
          # session-start.sh pipes it through `jq -Rs`, which reads raw
          # bytes, so a CRLF checkout would land inside the emitted JSON
          # string.
          #
          # Counts CR bytes with tr. No nested shell and no carriage return
          # passed as an argument, because both of those broke it:
          #
          # It used to shell out per file via `find -exec sh -c`, and `sh` is
          # dash on ubuntu, which has no `$'...'` ANSI-C quoting — so `$'\r'`
          # reached grep as the literal pattern `$\r`, a dollar followed by an
          # r. The check never looked for a carriage return on ubuntu at all. It
          # passed for as long as no *.sh happened to contain `$r`, then failed
          # the day one did (`[ -n "$ran" ]` in lib-parse.sh). A check that
          # cannot fail for the right reason is worse than none, because it is
          # trusted.
          #
          # `grep -rlU $'\r'` fixes the quoting and is wrong a second way: under
          # MSYS on the Windows runner a lone CR argument does not survive into
          # grep intact, and every file matches. tr reads bytes and cares about
          # neither shell.
          # `if`, not `[ ... ] && printf`. This step runs under `-e -o pipefail`,
          # and `&&` leaves the loop's exit status non-zero on every file that is
          # clean — so the whole substitution failed and the step aborted with an
          # empty `bad` and nothing printed, which reads exactly like a CRLF
          # failure and is not one.
          bad=$(find . \( -name '*.sh' -o -path './hooks/core.md' \) -not -path './.git/*' -print \
            | while IFS= read -r f; do
                if [ "$(tr -dc '\r' < "$f" | wc -c)" -gt 0 ]; then
                  printf '%s\n' "$f"
                fi
              done)
          if [ -n "$bad" ]; then echo "CRLF found in:"; echo "$bad"; exit 1; fi
          echo "all *.sh and hooks/core.md are LF"

      - name: Run the suite
        shell: bash
        run: bash tests/suite.sh
